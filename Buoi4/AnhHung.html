<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anh Hùng Tranh Bá - JS RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #111;
            background-image: 
                radial-gradient(circle at 50% 0%, #2a0800 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, #00122a 0%, transparent 50%);
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .title-font { font-family: 'Cinzel', serif; }

        /* Hiệu ứng rung lắc khi nhận sát thương */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake {
            animation: shake 0.4s;
            animation-iteration-count: 1;
            border-color: #ef4444 !important; /* Đỏ lên khi bị đánh */
            box-shadow: 0 0 15px #ef4444;
        }

        /* Tùy chỉnh thanh cuộn cho combat log */
        #combat-log::-webkit-scrollbar {
            width: 8px;
        }
        #combat-log::-webkit-scrollbar-track {
            background: #1f2937;
            border-radius: 4px;
        }
        #combat-log::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        #combat-log::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        .btn-attack {
            background: linear-gradient(to bottom, #dc2626, #991b1b);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            transition: all 0.1s;
        }
        .btn-attack:active {
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        .btn-attack:disabled {
            background: #4b5563;
            color: #9ca3af;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- MÀN HÌNH CHUẨN BỊ (SETUP) -->
    <div id="setup-screen" class="w-full max-w-md bg-gray-900 border border-gray-700 rounded-xl shadow-2xl p-8 transform transition-all">
        <h1 class="text-3xl title-font text-center text-amber-500 font-bold mb-6">Anh Hùng Xuất Thế</h1>
        
        <div class="mb-4">
            <label class="block text-gray-400 text-sm font-bold mb-2" for="hero-name">Tên Anh Hùng:</label>
            <input type="text" id="hero-name" value="Hoàng Huyền Nhi" 
                class="w-full bg-gray-800 border border-gray-600 text-white rounded-lg py-2 px-3 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors">
        </div>

        <div class="mb-8">
            <label class="block text-gray-400 text-sm font-bold mb-2" for="hero-class">Chọn Phân Cấp:</label>
            <select id="hero-class" 
                class="w-full bg-gray-800 border border-gray-600 text-white rounded-lg py-2 px-3 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors">
                <option value="chienbinh">Chiến binh</option>
                <option value="satthu">Sát thủ</option>
                <option value="thosan">Thợ săn</option>
            </select>
            <p id="class-desc" class="text-xs text-gray-500 mt-2 italic">Chiến binh: Cận chiến mạnh mẽ (+Str, -Agi, -Int)</p>
        </div>

        <button onclick="startGame()" 
            class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-colors text-lg title-font">
            BƯỚC VÀO TRẬN CHIẾN
        </button>
    </div>

    <!-- MÀN HÌNH CHIẾN ĐẤU (BATTLE) -->
    <div id="battle-screen" class="hidden w-full max-w-5xl flex-col items-center gap-6">
        <h2 class="text-4xl title-font text-center text-red-500 font-bold drop-shadow-lg mb-2">QUYẾT CHIẾN SINH TỬ</h2>
        
        <div class="flex flex-col md:flex-row w-full justify-between items-center gap-6">
            
            <!-- THẺ ANH HÙNG -->
            <div id="hero-card" class="w-full md:w-1/3 bg-gray-800 border-2 border-blue-900 rounded-xl p-5 shadow-lg transition-all duration-300 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-400 to-blue-600"></div>
                <h3 id="display-hero-name" class="text-2xl title-font text-blue-400 font-bold">Name</h3>
                <p id="display-hero-class" class="text-sm text-gray-400 mb-4">Class</p>
                
                <!-- Thanh Máu Anh Hùng -->
                <div class="mb-4">
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-bold text-gray-300">HP (Máu)</span>
<span id="hero-hp-text" class="font-bold text-green-400">105 / 105</span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-4 border border-gray-900">
                        <div id="hero-hp-bar" class="bg-green-500 h-full rounded-full transition-all duration-500 ease-out" style="width: 100%"></div>
                    </div>
                </div>

                <!-- Chỉ số -->
                <div class="grid grid-cols-3 gap-2 text-center bg-gray-900 rounded-lg p-3 border border-gray-700">
                    <div>
                        <div class="text-xs text-gray-500">STR</div>
                        <div id="hero-str" class="font-bold text-red-400">0</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500">AGI</div>
                        <div id="hero-agi" class="font-bold text-green-400">0</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500">INT</div>
                        <div id="hero-int" class="font-bold text-blue-400">0</div>
                    </div>
                </div>
            </div>

            <!-- NÚT ĐIỀU KHIỂN -->
            <div class="w-full md:w-auto flex flex-col justify-center items-center gap-4 shrink-0">
                <button id="attack-btn" onclick="executeRound()" 
                    class="btn-attack text-white font-bold py-4 px-8 rounded-full text-2xl title-font border-4 border-red-900 outline-none">
                    ⚔️ TẤN CÔNG!
                </button>
                <button id="restart-btn" onclick="resetGame()" class="hidden text-gray-400 hover:text-white underline text-sm">
                    Chơi lại từ đầu
                </button>
            </div>

            <!-- THẺ RỒNG -->
            <div id="dragon-card" class="w-full md:w-1/3 bg-gray-800 border-2 border-red-900 rounded-xl p-5 shadow-lg transition-all duration-300 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 to-orange-500"></div>
                <h3 class="text-2xl title-font text-red-500 font-bold">Rồng Già</h3>
                <p class="text-sm text-gray-400 mb-4">Boss Khủng Bố</p>
                
                <!-- Thanh Máu Rồng -->
                <div class="mb-4">
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-bold text-gray-300">HP (Máu)</span>
                        <span id="dragon-hp-text" class="font-bold text-red-400">600 / 600</span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-4 border border-gray-900">
                        <div id="dragon-hp-bar" class="bg-red-600 h-full rounded-full transition-all duration-500 ease-out" style="width: 100%"></div>
</div>
                </div>

                <!-- Chỉ số -->
                <div class="grid grid-cols-3 gap-2 text-center bg-gray-900 rounded-lg p-3 border border-gray-700">
                    <div>
                        <div class="text-xs text-gray-500">STR</div>
                        <div class="font-bold text-red-400">100</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500">AGI</div>
                        <div class="font-bold text-green-400">15</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500">INT</div>
                        <div class="font-bold text-blue-400">80</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- BẢNG LOG CHIẾN ĐẤU -->
        <div class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 shadow-inner mt-4">
            <h4 class="text-gray-400 font-bold mb-2 border-b border-gray-700 pb-1">Nhật Ký Chiến Đấu</h4>
            <div id="combat-log" class="h-48 overflow-y-auto space-y-2 text-sm md:text-base pr-2 font-mono">
                <!-- Log entries will appear here -->
                <div class="text-gray-500 italic">Trận chiến chuẩn bị bắt đầu...</div>
            </div>
        </div>

    </div>

    <script>
        // --- GAME STATE ---
        let hero = {
            name: "",
            className: "",
            maxHp: 105,
            hp: 105,
            baseStr: 63,
            baseAgi: 121,
            baseInt: 53,
            str: 0,
            agi: 0,
            int: 0
        };

        let dragon = {
            maxHp: 600,
            hp: 600,
            str: 100,
            agi: 15,
            int: 80
        };

        let isGameOver = false;

        // Cập nhật mô tả khi đổi class
        document.getElementById('hero-class').addEventListener('change', function(e) {
            const desc = document.getElementById('class-desc');
            if (e.target.value === 'chienbinh') desc.innerText = "Chiến binh: Cận chiến mạnh mẽ (+Str, -Agi, -Int)";
            else if (e.target.value === 'satthu') desc.innerText = "Sát thủ: Nhanh nhẹn, bạo kích (+Agi, +Int, -Str)";
            else if (e.target.value === 'thosan') desc.innerText = "Thợ săn: Trí tuệ sắc bén (+Int, -Str)";
        });

        // --- KHỞI TẠO GAME ---
        function startGame() {
            // Lấy dữ liệu form
            hero.name = document.getElementById('hero-name').value || "Vô Danh";
            const classChoice = document.getElementById('hero-class').value;

            // Reset máu
            hero.hp = hero.maxHp;
            dragon.hp = dragon.maxHp;
            isGameOver = false;

            // Tính toán chỉ số theo Class (Dựa trên logic ban đầu)
            hero.str = hero.baseStr;
hero.agi = hero.baseAgi;
            hero.int = hero.baseInt;

            switch(classChoice) {
                case "chienbinh":
                    hero.className = "Chiến Binh";
                    hero.str += 15;
                    hero.agi -= 10;
                    hero.int -= 5;
                    break;
                case "satthu":
                    hero.className = "Sát Thủ";
                    hero.str -= 15;
                    hero.agi += 10;
                    hero.int += 5;
                    break;
                case "thosan":
                    hero.className = "Thợ Săn";
                    hero.str -= 15;
                    hero.int += 15;
                    break;
            }

            // Cập nhật UI Anh Hùng
            document.getElementById('display-hero-name').innerText = hero.name;
            document.getElementById('display-hero-class').innerText = hero.className;
            document.getElementById('hero-str').innerText = hero.str.toFixed(0);
            document.getElementById('hero-agi').innerText = hero.agi.toFixed(0);
            document.getElementById('hero-int').innerText = hero.int.toFixed(0);

            // Cập nhật thanh máu ban đầu
            updateHealthBars();

            // Làm sạch log
            const logContainer = document.getElementById('combat-log');
            logContainer.innerHTML = `<div class="text-amber-500 font-bold mb-2">🔥 [HỆ THỐNG] Rồng Già đã xuất hiện! Chuẩn bị chiến đấu, ${hero.name}!</div>`;

            // Bật/tắt màn hình
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');
            document.getElementById('battle-screen').classList.add('flex');
            
            document.getElementById('attack-btn').disabled = false;
            document.getElementById('restart-btn').classList.add('hidden');
        }

        // --- HỆ THỐNG CHIẾN ĐẤU ---
        function executeRound() {
            if (isGameOver) return;
            
            const logContainer = document.getElementById('combat-log');
            logContainer.innerHTML += `<div class="text-gray-600 mt-2 mb-1 border-t border-gray-800 pt-1">--- Lượt mới ---</div>`;

            // 1. ANH HÙNG TẤN CÔNG
            let heroHit = (Math.random() * 100) > dragon.agi;
            
            if (heroHit) {
                let damage = hero.str;
                let isCritical = (Math.random() * 100) < hero.int;
                
                if (isCritical) {
                    damage *= 2;
                    dragon.hp -= damage;
                    logMessage(`💥 TRẢM LONG! ${hero.name} giáng đòn CHÍ MẠNG gây ${damage.toFixed(0)} sát thương cho Rồng!`, 'crit');
                } else {
                    dragon.hp -= damage;
logMessage(`⚔️ TRẢM LONG! ${hero.name} gây ${damage.toFixed(0)} sát thương cho Rồng.`, 'hero');
                }
                triggerShake('dragon-card');
            } else {
                logMessage(`💨 XÍ HỤT! Rồng Già lượn mình, né thành công đòn đánh của ${hero.name}!`, 'miss');
            }

            // Kiểm tra rồng chết
            if (dragon.hp <= 0) {
                dragon.hp = 0;
                updateHealthBars();
                endGame(true);
                return;
            }

            // 2. RỒNG TẤN CÔNG (Giới hạn né tránh của hero tối đa 80% để game có thể kết thúc)
            let effectiveHeroAgi = Math.min(hero.agi, 80); 
            let dragonHit = (Math.random() * 100) > effectiveHeroAgi;

            setTimeout(() => {
                if (dragonHit) {
                    let dragonDmg = dragon.str;
                    let dragonCrit = (Math.random() * 100) < dragon.int;

                    if (dragonCrit) {
                        dragonDmg *= 2;
                        hero.hp -= dragonDmg;
                        logMessage(`🔥 CHÍ MẠNG! HỎA CẦU KHỔNG LỒ! Rồng nung chín bạn với ${dragonDmg} sát thương!`, 'boss-crit');
                    } else {
                        hero.hp -= dragonDmg;
                        logMessage(`🔥 HỎA CẦU! Rồng khạc lửa gây ${dragonDmg} sát thương cho bạn!`, 'boss');
                    }
                    triggerShake('hero-card');
                } else {
                    logMessage(`✨ XÍ HỤT! ${hero.name} nhanh như chớp, né thành công ngọn lửa của Rồng!`, 'hero');
                }

                // Kiểm tra anh hùng chết
                if (hero.hp <= 0) {
                    hero.hp = 0;
                    updateHealthBars();
                    endGame(false);
                } else {
                    updateHealthBars();
                }
            }, 300); // Delay một chút để cảm giác có lượt đi
            
            updateHealthBars();
        }

        // --- CÁC HÀM TIỆN ÍCH ---
        function updateHealthBars() {
            // Hero
            let heroHpPercent = Math.max((hero.hp / hero.maxHp) * 100, 0);
            document.getElementById('hero-hp-bar').style.width = heroHpPercent + '%';
            document.getElementById('hero-hp-text').innerText = `${hero.hp.toFixed(0)} / ${hero.maxHp}`;
            
            // Dragon
            let dragonHpPercent = Math.max((dragon.hp / dragon.maxHp) * 100, 0);
            document.getElementById('dragon-hp-bar').style.width = dragonHpPercent + '%';
            document.getElementById('dragon-hp-text').innerText = `${dragon.hp.toFixed(0)} / ${dragon.maxHp}`;
        }

        function logMessage(msg, type) {
            const logContainer = document.getElementById('combat-log');
            const entry = document.createElement('div');
switch(type) {
                case 'hero': entry.className = 'text-blue-400'; break;
                case 'crit': entry.className = 'text-yellow-400 font-bold'; break;
                case 'boss': entry.className = 'text-orange-500'; break;
                case 'boss-crit': entry.className = 'text-red-500 font-bold'; break;
                case 'miss': entry.className = 'text-gray-400'; break;
                case 'victory': entry.className = 'text-green-400 font-bold text-lg mt-2'; break;
                case 'defeat': entry.className = 'text-red-600 font-bold text-lg mt-2'; break;
            }
            
            entry.innerText = msg;
            logContainer.appendChild(entry);
            // Tự động cuộn xuống dưới
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function triggerShake(elementId) {
            const el = document.getElementById(elementId);
            el.classList.remove('shake');
            void el.offsetWidth; // Trigger reflow để animation có thể chạy lại
            el.classList.add('shake');
            setTimeout(() => { el.classList.remove('shake'); }, 400);
        }

        function endGame(heroWins) {
            isGameOver = true;
            document.getElementById('attack-btn').disabled = true;
            document.getElementById('restart-btn').classList.remove('hidden');

            if (heroWins) {
                logMessage(`🏆 CHIẾN THẮNG!!! Chúc mừng ${hero.name} đã hạ gục Rồng Già!`, 'victory');
            } else {
                logMessage(`💀 THẤT BẠI!!! Chúc mừng ${hero.name} đã có tên trên menu món tối của Rồng: Hiệp sĩ nướng lá lốt!`, 'defeat');
            }
        }

        function resetGame() {
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('flex');
            document.getElementById('setup-screen').classList.remove('hidden');
        }

    </script>
</body>
</html>
