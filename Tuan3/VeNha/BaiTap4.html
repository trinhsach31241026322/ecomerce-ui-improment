<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 4 - Menu ngang</title>
    <style>
        ul {
            list-style-type: none; /* Bỏ dấu chấm đầu dòng của danh sách */
            padding: 0;
            margin: 30px;
            text-align: center; /* Canh giữa toàn bộ thanh menu */
        }

        ul li {
            display: inline-block; /* Xếp các mục nằm ngang trên cùng 1 hàng theo gợi ý đề bài */
            background-color: #00ffff; /* Màu nền xanh cyan giống hình mẫu */
            width: 100px; /* Độ rộng đều nhau cho từng ô */
            padding: 8px 0;
            margin: 0 3px; /* Khoảng cách nhỏ giữa các ô */
            text-align: center;
        }

        ul li a {
            color: #1a237e; /* Màu chữ xanh đậm (mặc định của thẻ link) */
            font-family: "Times New Roman", Times, serif; /* Font chữ có chân giống hình mẫu */
            font-size: 20px;
            text-decoration: underline; /* Giữ gạch chân giống hình mẫu */
        }
    </style>
</head>
<body>

    <ul>
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>

</body>
</html>
