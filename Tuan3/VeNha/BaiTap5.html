<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Khoa CNTTKD</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        /* Canh giữa toàn bộ nội dung trong khung theo gợi ý i */
        .best-shared {
            text-align: center;
        }

        .best-shared .logo {
            margin-bottom: 15px;
        }

        /* Định dạng dòng tiêu đề lớn */
        .best-shared h2 {
            font-size: 38px;
            font-weight: normal;
            color: #333333;
            margin: 15px 0;
        }

        /* Tô màu xanh dương và in đậm cụm từ Shared Hosting giống hình mẫu */
        .best-shared h2 strong {
            color: #00aeef;
            font-weight: bold;
        }

        /* Định dạng đoạn văn mô tả */
        .best-shared .lead-text {
            color: #666666;
            font-size: 16px;
            margin-bottom: 35px;
        }

        /* Xóa dấu chấm đầu dòng và khoảng thụt lề mặc định của danh sách nút */
        .best-shared .btn-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* Xếp 2 nút nằm ngang cạnh nhau theo gợi ý iii */
        .best-shared .btn-list li {
            display: inline-block;
            margin: 0 12px;
        }

        /* Định dạng nút bấm nền đen xám, chữ trắng, bỏ gạch chân theo gợi ý ii */
        .best-shared .btn-list li a {
            display: inline-block;
            background-color: #2d3032;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 4px;
            font-size: 15px;
            min-width: 110px;
            transition: background-color 0.2s ease;
        }

        /* Hiệu ứng đổi màu nhẹ khi rê chuột vào nút */
        .best-shared .btn-list li a:hover {
            background-color: #00aeef;
        }
    </style>
</head>
<body>
    <section class="best-shared">
        <p class="logo">
            <img style="width:200px; max-width:100%; height:auto" src="LOGO BIT.png" alt="BIT Logo">
        </p>
        <h2>Best <strong>Shared Hosting</strong> Company</h2>
        <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>
        <ul class="btn-list">
            <li><a href="./">View Plans</a></li>
            <li><a href="./">All Features</a></li>
        </ul>
    </section>
</body>
</html>
