<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Mua Sắm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Góc Mua Sắm</h1>
        <p>Sản phẩm nổi bật dành cho bạn</p>
    </header>

    <main class="container">
        <h2>Sản phẩm khuyến mãi</h2>

        <section class="product-grid">
            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80" alt="Tai nghe">
                <div class="product-info">
                    <h3>Tai nghe chụp tai</h3>
                    <p class="sale-price">189.000đ</p>
                    <div class="price-details">
                        <span class="old-price">249.000đ</span>
                        <span class="discount">-24%</span>
                    </div>
                    <button type="button">Xem sản phẩm</button>
                </div>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" alt="Đồng hồ">
                <div class="product-info">
                    <h3>Đồng hồ đeo tay</h3>
                    <p class="sale-price">259.000đ</p>
                    <div class="price-details">
                        <span class="old-price">329.000đ</span>
                        <span class="discount">-21%</span>
                    </div>
                    <button type="button">Xem sản phẩm</button>
                </div>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80" alt="Giày thể thao">
                <div class="product-info">
                    <h3>Giày thể thao</h3>
                    <p class="sale-price">399.000đ</p>
                    <div class="price-details">
                        <span class="old-price">499.000đ</span>
                        <span class="discount">-20%</span>
                    </div>
                    <button type="button">Xem sản phẩm</button>
                </div>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=500&q=80" alt="Máy ảnh">
                <div class="product-info">
                    <h3>Máy ảnh mini</h3>
                    <p class="sale-price">799.000đ</p>
                    <div class="price-details">
                        <span class="old-price">999.000đ</span>
                        <span class="discount">-20%</span>
                    </div>
                    <button type="button">Xem sản phẩm</button>
                </div>
            </article>
        </section>
    </main>

    <footer>
        Giao diện minh họa phục vụ bài tập HTML5 và CSS3.
    </footer>
</body>
</html>
